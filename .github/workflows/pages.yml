name: Deploy Quiet Worlds to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install native offline audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev
      - name: Install test dependencies
        run: npm ci
      - name: Validate static build
        run: npm run build
      - name: Install browser for portrait checks
        run: npx playwright install --with-deps chromium
      - name: Compare Rain and Fireplace on iPhone viewports
        run: npm run test:ui
      - name: Verify compact settings and centralized credits on mobile
        run: npm run test:settings
      - name: Verify every world icon in header and picker
        run: npm run test:icons
      - name: Save icon visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-icon-review
          path: test-results/icons
          retention-days: 14
      - name: Verify slider-selected Fireplace regions and render listening samples
        run: npm run test:audio
      - name: Verify actual mobile-browser playback and region switching
        run: npm run test:browser-audio
      - name: Install spectral QA dependencies
        run: python3 -m pip install numpy==2.5.3 scipy==1.18.1 soundfile==0.14.0
      - name: Verify source preservation and long loop seam
        run: npm run test:spectral
      - name: Save viewport screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-layout-checks
          path: test-results
          retention-days: 14
      - name: Require listening approval before publishing revised fire audio
        run: node -e "const m=require('./dist/audio/fireplace-visionear-regions-v2.json'); if(m.reviewStatus!=='APPROVED')throw new Error('Region transition preview needs listening approval before publication')"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
