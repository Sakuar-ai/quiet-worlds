name: Deploy Quiet Worlds to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Validate static build
        run: npm run build
      - name: Install browser for portrait checks
        run: npx playwright install --with-deps chromium
      - name: Compare Rain and Fireplace on iPhone viewports
        run: npm run test:ui
      - name: Verify single-bed Fireplace audio and render listening samples
        run: npm run test:audio
      - name: Save viewport screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-layout-checks
          path: test-results
          retention-days: 14
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
