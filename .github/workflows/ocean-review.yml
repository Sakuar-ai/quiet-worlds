name: Review Ocean before publishing
on:
  push:
    branches: [codex/ocean-rebuild]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:ocean
      - run: OCEAN_BROWSER=webkit npm run test:ocean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocean-rebuild-review
          path: test-results/ocean*
          retention-days: 14
